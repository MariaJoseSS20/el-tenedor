# https://render.com Blueprint
services:
  - type: web
    name: el-tenedor-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash build.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DB_SSL_REQUIRE
        value: "True"
